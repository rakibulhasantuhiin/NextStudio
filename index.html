    <script>
      // Ensure window.fetch has a valid setter for browser extension interceptors
      try {
        let _fetchRef = window.fetch ? window.fetch.bind(window) : null;
        Object.defineProperty(window, 'fetch', {
          get: function () {
            return _fetchRef;
          },
          set: function (fn) {
            _fetchRef = fn;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // ignore
      }

      // Suppress extension-originated errors from bubbling to app monitoring
      window.addEventListener(
        'error',
        function (event) {
          if (
            (event.filename && (event.filename.startsWith('chrome-extension:') || event.filename.startsWith('moz-extension:'))) ||
            (event.message && event.message.includes('Cannot set property fetch of #<Window>'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        },
        true
      );

      window.addEventListener(
        'unhandledrejection',
        function (event) {
          if (
            event.reason &&
            event.reason.message &&
            event.reason.message.includes('Cannot set property fetch of #<Window>')
          ) {
            event.preventDefault();
          }
        },
        true
      );
    </script>
